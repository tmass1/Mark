    <filter id="tile-shadow" x="-12%" y="-12%" width="124%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#56616B" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect x="60" y="45" width="904" height="923" rx="205" fill="url(#tile)" filter="url(#tile-shadow)"/>
  <rect x="70" y="55" width="884" height="903" rx="195" fill="none" stroke="url(#tile-rim)" stroke-width="7"/>
  <path d="M200 352V235Q200 205 230 205H340 M680 802H805Q835 802 835 772V635" fill="none" stroke="url(#corner)" stroke-width="50" stroke-linecap="round" stroke-linejoin="round" opacity="0.78"/>
  <g filter="url(#arrow-shadow)">
    <path d="M765 254C802 246 833 268 838 299C842 323 832 345 813 360L405 676L456 713C467 721 470 735 465 746C461 758 452 766 439 769L218 803C202 806 187 800 178 788C169 776 167 761 172 746L280 526C285 512 296 502 308 502C320 502 330 509 336 520L362 574C367 585 380 588 389 579L728 271C739 262 752 257 765 254Z" fill="url(#arrow)" stroke="url(#arrow-rim)" stroke-width="6.5" stroke-linejoin="round"/>
    <path d="M754 277C704 305 656 347 607 392C516 475 440 548 352 629" fill="none" stroke="url(#shaft-sheen)" stroke-width="25" stroke-linecap="round" opacity="0.72"/>
  </g>
  <path d="M638 357C661 331 686 307 716 286" fill="none" stroke="#FFFFFF" stroke-opacity="0.92" stroke-width="9" stroke-linecap="round"/>
