<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Mark highlight arrow — light</title>
  <desc id="desc">A single coral glass arrow pointing down-left between two capture corners on a porcelain tile.</desc>
  <defs>
    <linearGradient id="tile" x1="100" y1="50" x2="900" y2="960" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#F8F9FA"/>
      <stop offset="1" stop-color="#ECEFF2"/>
    </linearGradient>
    <linearGradient id="tile-rim" x1="120" y1="70" x2="860" y2="930" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.90"/>
      <stop offset="0.46" stop-color="#D8DDE2" stop-opacity="0.40"/>
      <stop offset="1" stop-color="#AEB6BE" stop-opacity="0.52"/>
    </linearGradient>
    <linearGradient id="arrow" x1="760" y1="265" x2="205" y2="800" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF8C83"/>
      <stop offset="0.22" stop-color="#FF6F64"/>
      <stop offset="0.52" stop-color="#F94E43"/>
      <stop offset="0.78" stop-color="#EB302F"/>
      <stop offset="1" stop-color="#C91824"/>
    </linearGradient>
    <linearGradient id="arrow-rim" x1="740" y1="245" x2="220" y2="810" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.54"/>
      <stop offset="0.42" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#8F111B" stop-opacity="0.36"/>
    </linearGradient>
    <linearGradient id="corner" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#59636D"/>
      <stop offset="1" stop-color="#252B31"/>
    </linearGradient>
    <linearGradient id="shaft-sheen" x1="755" y1="270" x2="365" y2="625" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.48"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="arrow-shadow" x="-12%" y="-12%" width="132%" height="140%">
      <feDropShadow dx="3" dy="7" stdDeviation="4" flood-color="#8D0E18" flood-opacity="0.44"/>
